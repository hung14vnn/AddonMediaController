services:
  karaoke-worker:
    build:
      context: .
      dockerfile: Dockerfile.karaoke
    image: addonify-karaoke:local
    container_name: addonify-karaoke
    restart: unless-stopped
    networks:
      - music
    environment:
      KARAOKE_MUSIC_ROOTS: /music
      KARAOKE_CACHE_TMP_ROOT: /app/cache/karaoke/tmp
    volumes:
      - cache:/app/cache
      - ./music:/music:ro
    cpus: "2.0"
    mem_limit: 4g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8091/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  slskd:
    image: slskd/slskd:latest
    container_name: slskd
    restart: unless-stopped
    networks:
      - music
    ports:
      - "5030:5030"
    environment:
      SLSKD_REMOTE_CONFIGURATION: "true"
    volumes:
      - ./slskd:/app
      - ./downloads:/slskd-downloads
      - ./music:/music

  gluetun:
    image: qmcgaw/gluetun:v3.41.3
    container_name: addonify-vpn
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    networks:
      - music
    ports:
      # addonify shares Gluetun's network namespace, so public ports belong here.
      - "8688:8688"
    environment:
      VPN_SERVICE_PROVIDER: protonvpn
      VPN_TYPE: wireguard
      SERVER_COUNTRIES: Singapore
      WIREGUARD_PRIVATE_KEY: ${PROTONVPN_WIREGUARD_PRIVATE_KEY:?Set PROTONVPN_WIREGUARD_PRIVATE_KEY in .env.proton}
      FREE_ONLY: "on"
      # Keep Docker-internal calls (for example addonify -> slskd) off the VPN.
      FIREWALL_OUTBOUND_SUBNETS: ${MUSIC_DOCKER_SUBNET:?Set MUSIC_DOCKER_SUBNET in .env.proton}
      TZ: Asia/Ho_Chi_Minh

  addonify:
    build:
      context: .
      dockerfile: Dockerfile
    image: addonify:local
    container_name: addonify
    restart: unless-stopped
    depends_on:
      slskd:
        condition: service_started
      karaoke-worker:
        condition: service_started
      gluetun:
        condition: service_healthy
    network_mode: "service:gluetun"
    environment:
      TZ: Asia/Ho_Chi_Minh
      PORT: "8688"
      PUID: "1000"
      PGID: "1000"
      SLSKD_DOWNLOADS_PATH: /slskd-downloads
      # Override in .env when using a private or additional registry.
      SPOTIFLAC_REGISTRIES: ${SPOTIFLAC_REGISTRIES:-https://raw.githubusercontent.com/spotiflacapp/SpotiFLAC-Extension/main/registry.json}
    volumes:
      - config:/app/config
      - cache:/app/cache
      - plugins:/app/plugins   # installed plugins; without this they vanish on recreate
      - imports:/app/imports   # drop-importer staging
      - ./downloads:/slskd-downloads:rw
      - ./music:/music         # final managed music library
      - ./spotiflac-downloads:/spotiflac-downloads:rw  # SpotiFLAC output; persists on the host

volumes:
  config:
  cache:
  plugins:
  imports:

networks:
  music:
    name: music
