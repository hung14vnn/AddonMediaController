services:
  slskd:
    image: slskd/slskd:latest
    container_name: slskd
    restart: unless-stopped
    networks:
      - music
    ports:
      - "5030:5030"
    environment:
      SLSKD_REMOTE_CONFIGURATION: "true"
    volumes:
      - ./slskd:/app
      - ./downloads:/slskd-downloads
      - ./music:/music

  addonify:
    build:
      context: .
      dockerfile: Dockerfile
    image: addonify:local
    container_name: addonify
    restart: unless-stopped
    depends_on:
      - slskd
    networks:
      - music
    ports:
      - "8688:8688"
    environment:
      TZ: Asia/Ho_Chi_Minh
      PORT: "8688"
      PUID: "1000"
      PGID: "1000"
      SLSKD_DOWNLOADS_PATH: /slskd-downloads
    volumes:
      - config:/app/config
      - cache:/app/cache
      - plugins:/app/plugins   # installed plugins; without this they vanish on recreate
      - imports:/app/imports   # drop-importer staging
      - ./music:/music         # final managed music library
      - ./spotiflac-downloads:/spotiflac-downloads  # SpotiFLAC output; persists on the host
networks:
  music:
    name: music